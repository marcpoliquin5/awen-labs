name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install locked dependencies
        run: npm ci

      # base_path is "/awen-labs" on the project URL and "" with a custom domain,
      # so the build follows the repository's Pages domain setting automatically.
      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SUPABASE_PROJECT_ID: local-build
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture_00000000
          VITE_SUPABASE_URL: https://example.invalid
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
